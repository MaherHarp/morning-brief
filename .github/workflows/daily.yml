name: Morning Brief

on:
  schedule:
    # 10:30 UTC = 6:30am during EDT (summer)
    - cron: "30 10 * * *"
    # 11:30 UTC = 6:30am during EST (winter)
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL:  ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TEST_MODE: 'true'  # Set to 'true' for testing. For production, use: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: python brief.py

